name: Sync Drive & Run Automatically

on:
  schedule:
    - cron: '0 */3 * * *'  # Chạy định kỳ 3 tiếng một lần
  workflow_dispatch:      # Cho phép bấm chạy thủ công khi cần

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # ÉP BUỘC: Nếu chạy quá 15 phút sẽ tự ngắt, không bao giờ bị kẹt ca đêm nữa!

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python script
        run: python run_from_drive.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto update JSON from Google Drive"
          git push
