name: Sync Drive & Run Automatically

on:
  schedule:
    - cron: '*/10 * * * *' # Chạy tự động mỗi 10 phút
  workflow_dispatch: # Cho phép bấm chạy thủ công

jobs:
  run-from-drive:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gdown

    - name: Run script connect to Drive
      env:
        GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      run: python run_from_drive.py

    - name: Commit updated JSON
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]"
        git add aggregated_output.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update JSON" && git push)
