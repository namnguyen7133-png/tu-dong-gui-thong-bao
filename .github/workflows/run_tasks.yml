name: Tự Động Chạy Python & Cập Nhật Giao Diện Mobile

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:      # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên điện thoại/web

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chạy tệp điều phối tổng
        run: |
          python dieu_phoi_tong_6_tep.py

      - name: Tổng hợp JSON ra index.html
        run: |
          python tong_hop_json.py

      - name: Đẩy kết quả cập nhật lên GitHub
        run: |
          git config --local user.email "namnguyen7133@gmail.com"
          git config --local user.name "namnguyen7133-png"
          git add KET_QUA_JSON/*.json index.html
          git diff-index --quiet HEAD || (git commit -m "🤖 [Auto Action] Cập nhật kết quả dữ liệu tự động" && git push)
