name: Sync Drive & Run Automatically

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *' # Chạy tự động định kỳ 10 phút/lần

permissions:
  contents: write # Cấp quyền ghi đè để Bot tự động cập nhật tệp JSON lên web

jobs:
  run-from-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Run script connect to Drive
        run: python run_from_drive.py

      - name: Commit updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add aggregated_output.json
          git commit -m "Auto update JSON from Google Drive" || echo "No changes to commit"
          git push
