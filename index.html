<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Kết Quả - Mobile</title>
    <style>
        body {
            background-color: #121212;
            color: #E0E0E0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            font-size: 16px;
        }
        h1 {
            color: #00FFC8;
            font-size: 18px;
            text-align: center;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #FFF;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .card {
            background-color: #1E1E2E;
            border-left: 5px solid #FF9800;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .card-title {
            font-weight: bold;
            color: #FFD700;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .alert {
            color: #FF6B6B;
            font-weight: bold;
            margin-top: 5px;
            background: #2A1515;
            padding: 5px;
            border-radius: 4px;
        }
        .link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 12px;
            background-color: #0088CC;
            color: #FFFFFF;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>📊 TRA CỨU KẾT QUẢ ĐIỆN THOẠI</h1>
    <div style="font-size: 13px; color: #888; text-align: center; margin-bottom: 10px;">
        Cập nhật: 2026-10-26 13:59:23 | Tổng số: 0 kết quả
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Gõ tìm kiếm tên, bệnh lý..." onkeyup="filterCards()">

    <div id="container">

    </div>
    <script>
        function filterCards() {
            var input = document.getElementById('searchInput').value.toLowerCase();
            var cards = document.getElementsByClassName('card');
            for (var i = 0; i < cards.length; i++) {
                var text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
