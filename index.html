<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Báo Cáo Tự Động</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; text-align: left; }
        .success { color: #4caf50; font-weight: bold; }
        button { background: #00bcd4; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>📊 BÁO CÁO TỰ ĐỘNG GOOGLE DRIVE</h1>
    <button onclick="location.reload()">Làm mới dữ liệu</button>
    <div class="card" id="content">Đang tải dữ liệu...</div>

    <script>
        fetch('aggregated_output.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('content');
                let html = '';
                data.forEach(item => {
                    html += `<h3>📌 Tệp: ${item.file_name}</h3>`;
                    html += `<p class="success">🟢 Trạng thái: Hoạt động bình thường</p>`;
                    html += `<pre style="background:#2d2d2d; padding:10px; border-radius:5px;">${JSON.stringify(item.content, null, 4)}</pre>`;
                    html += `<hr style="border-color: #444;">`;
                });
                container.innerHTML = html;
            })
            .catch(err => {
                document.getElementById('content').innerHTML = '<span style="color:red">Lỗi tải dữ liệu JSON!</span>';
            });
    </script>
</body>
</html>
